spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      url: ${REDIS_URL_INTERNAL}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

resend:
  api:
    key: ${RESEND_API_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_SECRET_KEY_EXPIRATION}

app:
  mail:
    from: ${BREVO_USER_EMAIL}

server:
  address: 0.0.0.0
#  port: 8080
  servlet:
    context-path: /api/v1.0
  port: 8080

money:
  manager:
    frontend:
      url: ${FRONTEND_URL}
    activation:
      url: ${BACKEND_ACTIVATION_URL}


