spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moneymanager
    username: dev
    password: Dev!@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_SECRET_KEY_EXPIRATION}



resend:
  api:
    key: ${RESEND_API_KEY}

app:
  mail:
    from: moneymanager@cloudshare.co.in

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api/v1.0

money:
  manager:
    frontend:
      url: ${FRONTEND_URL}
    activation:
      url: ${BACKEND_ACTIVATION_URL}
